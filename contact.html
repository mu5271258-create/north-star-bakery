<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Star Bakery | Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <img src="bakery-logo_c.png"
         alt="North Star Bakery logo">

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <h1>Contact North Star Bakery</h1>

    <p>
      Use the form below to send us a pre-order request
      or a general question.
    </p>

    <form action="#" method="post">

      <fieldset>

        <legend>Bakery Request Information</legend>

        <p>
          <label for="name">Name:</label><br>
          <input type="text"
                 id="name"
                 name="name"
                 required>
        </p>

        <p>
          <label for="email">Email:</label><br>
          <input type="email"
                 id="email"
                 name="email"
                 required>
        </p>

        <p>
          <label for="pickup-date">Pickup Date:</label><br>
          <input type="date"
                 id="pickup-date"
                 name="pickup-date"
                 required>
        </p>
